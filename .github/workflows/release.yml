# Publish the Android client from a vX.Y.Z tag. The F-Droid repo imports the
# signed split APKs and store listing from this exact tag.
name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build or create, e.g. v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  FDROID_DISPATCH_TOKEN: ${{ secrets.FDROID_DISPATCH_TOKEN }}

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: player-android
    steps:
      # Claude sessions cannot push tags, so a dispatch creates a missing one.
      # Runs before the checkout, which needs the tag to exist.
      - name: Create the tag if it does not exist yet
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG exists, rebuilding it"; exit 0
          fi
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/player-android/pubspec.yaml?ref=$GITHUB_SHA" -H "Accept: application/vnd.github.raw" | sed -n "s/^version: *\([^+]*\).*/\1/p")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version $version in player-android/pubspec.yaml"; exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null
          echo "Created $TAG at $GITHUB_SHA"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check release version
        id: version
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match player-android/pubspec.yaml ($version)"
            exit 1
          fi
          echo "flutter=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.version.outputs.flutter }}
          channel: stable
          cache: true

      - name: Restore Android release key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$ANDROID_KEY_ALIAS" ] || \
             [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Android signing secrets are missing; see player-android/docs/fdroid-release.md"
            exit 1
          fi
          keystore="$RUNNER_TEMP/player-release.jks"
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$keystore" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" \
            > android/key.properties
          chmod 600 android/key.properties

      - name: Build ABI split APKs
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Verify all APKs use the release certificate
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk" ]; then
            echo "::error::Android SDK path is unavailable"
            exit 1
          fi
          apksigner=$(find "$sdk/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner is unavailable under $sdk/build-tools"
            exit 1
          fi
          expected=8437806042a169d73b6ccf0331edeef7b6841f59872ad9d61b0b9ca36625a88b
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="build/app/outputs/flutter-apk/app-$abi-release.apk"
            if [ ! -s "$apk" ]; then
              echo "::error::Missing or empty APK: $apk"
              exit 1
            fi
            certs=$("$apksigner" verify --print-certs "$apk")
            echo "$apk: $certs"
            if ! grep -Fqi "$expected" <<< "$certs"; then
              echo "::error::$apk is not signed with the pinned Player release certificate"
              exit 1
            fi
          done

      - name: Attach APKs to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apks=()
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="player-$TAG-$abi.apk"
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "$apk"
            apks+=("$apk")
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" "${apks[@]}" --clobber

      - name: Refresh the F-Droid repo
        if: env.FDROID_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.FDROID_DISPATCH_TOKEN }}
        run: gh api repos/snonux/fdroid/dispatches -f event_type=app-release

      - name: Remove key material
        if: always()
        run: rm -f "$RUNNER_TEMP/player-release.jks" android/key.properties
