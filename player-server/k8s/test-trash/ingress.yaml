apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: player
  namespace: player-trash-test
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: player-test.f3s.buetow.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: player
                port: {number: 8080}
    - host: www.player-test.f3s.buetow.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: player
                port: {number: 8080}
    - host: standby.player-test.f3s.buetow.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: player
                port: {number: 8080}
