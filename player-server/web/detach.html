<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player — Detached</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/toast.css">
<link rel="stylesheet" href="/css/player.css">
<script type="module" src="/js/detachPopup.js"></script>
</head>
<body class="detach-page">
<aside id="player" class="player open detached" aria-label="Detached player">
  <div class="stage">
    <video id="media-video" playsinline controlslist="nodownload"></video>
    <audio id="media-audio" class="hidden"></audio>
    <img id="media-image" class="media-image hidden" alt="">
    <img id="cover-art" class="cover-art hidden" alt="Cover" loading="lazy">
    <div id="big-play" class="big-play" role="button" aria-label="Play" tabindex="0">
      <div class="play-icon">&#9654;</div>
    </div>
  </div>
  <div id="player-music-identity" class="player-music-identity" hidden></div>
  <div class="controls">
    <div class="seek-controls">
      <div class="time" id="time-elapsed">0:00</div>
      <div id="progress-track" class="progress-track" tabindex="0" aria-label="Seek">
        <div id="progress-buffered" class="progress-buffered"></div>
        <div id="progress-fill" class="progress-fill"></div>
        <div id="progress-thumb" class="progress-thumb" aria-hidden="true"></div>
      </div>
      <div class="time" id="time-total">0:00</div>
    </div>
    <div class="transport-controls">
      <button id="btn-play" class="icon-btn" aria-label="Play/Pause">&#9654;</button>
      <button id="btn-prev" class="icon-btn" aria-label="Previous">&#9198;</button>
      <button id="btn-next" class="icon-btn" aria-label="Next">&#9197;</button>
      <button id="btn-save-position" class="btn btn-sm hidden" type="button" aria-controls="bookmarks-modal">Save position</button>
      <button id="btn-bookmarks" class="btn btn-sm hidden" type="button" aria-controls="bookmarks-modal">Bookmarks</button>
      <button id="btn-player-notes" class="btn btn-sm" type="button" aria-controls="notes-modal">Notes</button>
      <button id="btn-player-favorite" class="btn btn-sm" type="button" aria-label="Toggle favorite">Favorite</button>
      <div class="detached-tools">
        <div class="volume-control">
          <button id="btn-mute" class="icon-btn" aria-label="Mute">&#128266;</button>
          <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="1" class="volume-slider" aria-label="Volume">
        </div>
        <button id="btn-fullscreen" class="icon-btn" aria-label="Fullscreen">&#9978;</button>
        <span id="crop-indicator" class="crop-indicator hidden" title="Crop mode active (c)">✂️</span>
      </div>
    </div>
  </div>
<div id="bookmarks-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="bookmarks-title">
  <div class="modal">
    <div class="modal-header">
      <h3 id="bookmarks-title">Position bookmarks</h3>
      <div class="spacer"></div>
      <button id="bookmarks-close" class="icon-btn" type="button" aria-label="Close bookmarks">✕</button>
    </div>
    <p id="bookmarks-media" class="text-muted text-sm"></p>
    <form id="bookmark-form">
      <p id="bookmark-position"></p>
      <label for="bookmark-label">Label (optional, up to 200 characters)</label>
      <input id="bookmark-label" type="text" autocomplete="off">
      <div class="flex gap-2 mt-1">
        <button id="bookmark-save" class="btn btn-primary btn-sm" type="submit">Save position</button>
        <button id="bookmark-capture" class="btn btn-sm" type="button">Use current position</button>
      </div>
    </form>
    <p id="bookmarks-status" role="status" aria-live="polite"></p>
    <button id="bookmarks-retry" class="btn btn-sm" type="button" hidden>Retry loading bookmarks</button>
    <ul id="bookmarks-list" class="bookmarks-list" aria-label="Saved positions"></ul>
  </div>
</div>
</aside>
<footer class="toast" id="toast" role="status" aria-live="polite"></footer>
<div id="notes-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="notes-title">
  <div class="modal">
    <div class="modal-header">
      <h3 id="notes-title">Notes</h3>
      <div class="spacer"></div>
      <button id="notes-close" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <textarea id="notes-textarea" rows="6" placeholder="Add your notes…"></textarea>
    <div class="flex justify-end gap-2 mt-1">
      <button id="notes-delete" class="btn btn-danger btn-sm">Delete</button>
      <button id="notes-save" class="btn btn-primary btn-sm">Save</button>
    </div>
  </div>
</div>
</body>
</html>
