<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shared Media</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/player.css">
<link rel="stylesheet" href="/css/toast.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-body);
    color: var(--text-primary);
    font-family: var(--font-sans);
    display: flex;
    flex-direction: column;
  }
  .page-wrap {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    box-sizing: border-box;
  }
  .container {
    width: 100%;
    max-width: 720px;
    text-align: center;
  }
  h1 {
    margin: 0 0 1rem;
    font-size: 1.25rem;
    color: var(--text-primary);
  }

  /* Player overrides for standalone share page */
  .player {
    display: block;
    position: static;
    border-top: none;
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-md);
  }
  .player .stage {
    height: clamp(14rem, 35vh, 28rem);
    background: var(--player-stage-bg);
  }
  .player.is-fullscreen {
    position: fixed;
    inset: 0;
    z-index: 100;
    border-radius: 0;
  }

  /* Shown instead of the player when the share cannot be viewed. */
  .share-status {
    margin: 1rem 0 0;
    color: var(--text-primary);
  }
</style>
</head>
<body>
<div class="page-wrap">
  <div class="container">
    <h1 id="share-title">Shared Media</h1>
    <p id="share-status" class="share-status hidden" role="alert"></p>
    <noscript><p class="share-status">This page needs JavaScript to play the shared file.</p></noscript>
    <aside id="player" class="player open" aria-label="Player">
      <div class="stage">
        <video id="media-video" playsinline controlslist="nodownload"></video>
        <audio id="media-audio" class="hidden"></audio>
        <img id="media-image" class="media-image hidden" alt="">
        <img id="cover-art" class="cover-art hidden" alt="Cover" loading="lazy">
        <div id="big-play" class="big-play" role="button" aria-label="Play" tabindex="0">
          <div class="play-icon">&#9654;</div>
        </div>
      </div>
      <div class="controls">
        <button id="btn-toggle-stage" class="icon-btn" aria-label="Toggle stage">&#9978;</button>
        <button id="btn-play" class="icon-btn" aria-label="Play/Pause">&#9654;</button>
        <div class="time" id="time-elapsed">0:00</div>
        <div id="progress-track" class="progress-track" tabindex="0" aria-label="Seek">
          <div id="progress-buffered" class="progress-buffered"></div>
          <div id="progress-fill" class="progress-fill"></div>
          <div id="progress-thumb" class="progress-thumb" aria-hidden="true"></div>
        </div>
        <div class="time" id="time-total">0:00</div>
        <div class="volume-control">
          <button id="btn-mute" class="icon-btn" aria-label="Mute">&#128266;</button>
          <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="1" class="volume-slider" aria-label="Volume">
        </div>
        <button id="btn-download" class="icon-btn" aria-label="Download">&#11123;</button>
        <button id="btn-fullscreen" class="icon-btn" aria-label="Fullscreen">&#9978;</button>
      </div>
    </aside>
  </div>
</div>
<footer class="toast" id="toast" role="status" aria-live="polite"></footer>

<script type="module">
  import { initPlayer, loadMediaDirect } from '/js/player.js';
  import { SHARE_DISPLAY_FAILED_MESSAGE, openShareViewing } from '/js/shareViewing.js';

  // The page always settles in a visible state: the player with the shared
  // file, or a message saying why not. An exception anywhere in the setup
  // must not leave a blank page — least of all after the viewing was opened
  // and a use of the link spent.
  let outcome;
  try {
    outcome = await showShare();
  } catch (err) {
    console.error(err);
    outcome = { state: 'failed', message: SHARE_DISPLAY_FAILED_MESSAGE };
  }
  if (outcome.state !== 'open') showStatus(outcome.message, outcome.keepPlayer);
  // Marks the page as settled ("open", "gone" or "failed"): until then the
  // player has nothing to play. Browser tests wait for it before pressing
  // play.
  document.body.dataset.shareViewing = outcome.state;

  // showShare opens the viewing and hands the shared file to the player. It
  // resolves with { state, message, keepPlayer }; state is "open", "gone" or
  // "failed".
  async function showShare() {
    initPlayer();
    const data = JSON.parse(document.getElementById('share-meta').textContent);
    if (!data || !data.media) throw new Error('share metadata is missing');
    const name = decodedFileName(data.media.file_name);
    document.getElementById('share-title').textContent = name;
    document.title = `${name} — Shared Media`;

    // Loading this page cost nothing (link previewers load it too). The
    // viewing — one use of the share's max_uses — is opened here, and only
    // then may any media URL be touched: the POST sets a cookie scoped to
    // /s/{token} that the browser sends with the player's HEAD probe, every
    // ranged media request, the thumbnail and the download, so none of them
    // costs another use. On a reload the cookie is still there and the POST
    // consumes nothing. See shareViewing.js.
    const viewing = await openShareViewing(location.pathname);
    if (viewing.state !== 'open') return viewing;

    // First, and apart from the player: whatever happens to the player
    // below, the visitor can still fetch the file the use was spent on.
    const downloadable = enableDownload(data.download_url);
    try {
      showSharedMedia(data, name);
    } catch (err) {
      console.error(err);
      const hint = downloadable ? ' You can still download it.' : '';
      return { state: 'failed', message: SHARE_DISPLAY_FAILED_MESSAGE + hint, keepPlayer: downloadable };
    }
    return { state: 'open' };
  }

  // decodedFileName undoes the HTML escaping the server applies to the file
  // name it embeds; the result is only ever used as text.
  function decodedFileName(escaped) {
    const decoder = document.createElement('textarea');
    decoder.innerHTML = escaped || '';
    return decoder.value || 'Shared Media';
  }

  // enableDownload wires the download button and reports whether there is
  // something to download. The request carries the viewing cookie.
  function enableDownload(url) {
    const button = document.getElementById('btn-download');
    if (!button || !url) return false;
    button.addEventListener('click', () => { location.href = url; });
    return true;
  }

  // showSharedMedia hands the share to the player. The URLs are plain
  // same-origin paths; the viewing cookie is their credential.
  //
  // playback_url is the compat stream when the server flags the share as
  // "transcoded" (formats browsers cannot decode); the flag makes the player
  // wait for the rendition instead of loading a 503. Servers without the
  // hint only send stream_url. The decoded name is used in error toasts.
  function showSharedMedia(data, name) {
    const media = { ...data.media, file_name: name, transcoded: !!data.transcoded };
    loadMediaDirect(media, data.playback_url || data.stream_url, data.thumb_url, 0);
  }

  // showStatus tells the visitor why the share is not shown: used up, expired
  // or revoked since the page was loaded, the server did not answer, or the
  // player could not be set up. The player is hidden unless keepPlayer asks
  // to leave it (its download button still works).
  function showStatus(message, keepPlayer = false) {
    if (!keepPlayer) document.getElementById('player')?.classList.add('hidden');
    const status = document.getElementById('share-status');
    status.textContent = message;
    status.classList.remove('hidden');
  }
</script>

<script id="share-meta" type="application/json"><!--SHARE_MEDIA--></script>
</body>
</html>
